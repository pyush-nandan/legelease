name: RAG Evaluation

on:
    pull_request:
        branches:
        - main
    workflow_dispatch:
        inputs:
            max_samples:
                description: 'Questions judged by RAGAS (0 = all; each costs about 15k judge tokens)'
                default: '10'

jobs:
    # Needs no secrets, so it also runs on pull requests from forks
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: pip
                cache-dependency-path: requirements*.txt

            - name: install dependencies
              run:
                pip install -r requirements-dev.txt

            - name: Cache embedding model and vector index
              uses: actions/cache@v4
              with:
                path: |
                  ~/.cache/huggingface
                  chroma_db
                key: index-${{ hashFiles('data/**', 'ingest_data.py', 'text_utils.py') }}

            - name: run unit tests
              run: python3 -m pytest tests -q

            - name: run retrieval evaluation
              run: python3 evaluate.py --retrieval-only

    evaluate:
        needs: tests
        # Secrets are not available to pull requests from forks
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: pip
                cache-dependency-path: requirements*.txt

            - name: install dependencies
              run:
                pip install -r requirements.txt

            - name: Cache embedding model and vector index
              uses: actions/cache@v4
              with:
                path: |
                  ~/.cache/huggingface
                  chroma_db
                key: index-${{ hashFiles('data/**', 'ingest_data.py', 'text_utils.py') }}

            - name: run evaluate.py
              run: python3 evaluate.py
              env:
                GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
                EVAL_MAX_SAMPLES: ${{ inputs.max_samples || '10' }}

            - name: Upload evaluation results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: evaluation-results
                path: |
                  evaluation_results.csv
                  evaluation_summary.json
                  retrieval_results.csv
                  rag_responses_cache.json
                if-no-files-found: ignore
